<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <img class="brand-logo" src="img/cw_logo_horizontal.png" alt="charity: water logo">
    <h1>Water Quest</h1>
    <p class="instructions">Click the water drops before time runs out!</p>

    <div class="info">
      <p class="info-card">Score: <span id="score">0</span></p>
      <p class="info-card">Time: <span id="time">20</span>s</p>
    </div>

    <div class="controls">
      <button id="start-btn">Start Game</button>
      <button id="reset-btn">Reset</button>
    </div>
    
    <p id="message">Press start to begin.</p>

    <div id="game-area">
      <img class="arena-can left" src="img/water-can.png" alt="Water can decoration">
      <img class="arena-can right" src="img/water-can.png" alt="Water can decoration">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
